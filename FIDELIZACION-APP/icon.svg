<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFE500" />
            <stop offset="50%" stop-color="#FFD600" />
            <stop offset="100%" stop-color="#FFC800" />
        </linearGradient>
    </defs>
    <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
    <!-- Sun rays -->
    <g transform="translate(256, 220)" stroke="#1A1A1A" stroke-width="12" stroke-linecap="round">
        <line x1="0" y1="-85" x2="0" y2="-105"/>
        <line x1="60" y1="-60" x2="74" y2="-74"/>
        <line x1="-60" y1="-60" x2="-74" y2="-74"/>
        <line x1="82" y1="-15" x2="100" y2="-20"/>
        <line x1="-82" y1="-15" x2="-100" y2="-20"/>
        <line x1="75" y1="50" x2="90" y2="60"/>
        <line x1="-75" y1="50" x2="-90" y2="60"/>
    </g>
    <!-- Coffee bean -->
    <ellipse cx="256" cy="240" rx="70" ry="85" fill="#1A1A1A"/>
    <path d="M256 165 C240 200, 240 280, 256 325" stroke="#FFE500" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Brand text -->
    <text x="256" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="52" fill="#1A1A1A">Buen día</text>
    <text x="256" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="32" letter-spacing="8" fill="#1A1A1A">CAFÉ</text>
</svg>
